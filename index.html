<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f5d3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CIBO 주문판">
<title>CIBO 주문판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 좌측 테이블 평면 + 우측 주문지(넓은 화면), 휴대폰에서는 주문지가 전체 화면으로 덮음 */
:root{
  --bg:#f3f4ef; --surface:#ffffff; --sunk:#e8eae2; --line:#d5d8cc;
  --fg:#1d221b; --muted:#646b5f;
  --basil:#2f5d3a; --basil-ink:#ffffff; --basil-soft:#dde8dc;
  --tomato:#b8432f; --tomato-soft:#f6e1dc; --amber:#9a6a12; --amber-soft:#f4ead3;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141812; --surface:#1d221b; --sunk:#262c24; --line:#353d32;
  --fg:#e9ece4; --muted:#9aa294;
  --basil:#7fb98a; --basil-ink:#10200f; --basil-soft:#26382a;
  --tomato:#e7836f; --tomato-soft:#3d241f; --amber:#e0b55c; --amber-soft:#3a3020;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141812; --surface:#1d221b; --sunk:#262c24; --line:#353d32;
  --fg:#e9ece4; --muted:#9aa294;
  --basil:#7fb98a; --basil-ink:#10200f; --basil-soft:#26382a;
  --tomato:#e7836f; --tomato-soft:#3d241f; --amber:#e0b55c; --amber-soft:#3a3020;
  color-scheme:dark}
html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--basil);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.app{display:flex;flex-direction:column;min-height:100%}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
.brand small{font-weight:500;color:var(--muted);font-size:12px}
nav.tabs{display:flex;gap:4px;background:var(--sunk);padding:3px;border-radius:999px;margin-left:auto}
nav.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-weight:600;color:var(--muted)}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.mode{font-size:12px;color:var(--muted);width:100%}
.mode.warn{color:var(--amber)}
main{flex:1;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
.view[hidden]{display:none!important}

/* 테이블 + 주문지 */
.floor{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:16px;align-items:start}
.floor.noorder{grid-template-columns:minmax(0,1fr)}
.sumbar{display:flex;gap:20px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-bottom:12px}
.sumbar b{color:var(--fg);font-weight:600}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.tbl{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;min-height:104px;text-align:left;display:flex;flex-direction:column;gap:4px}
.tbl .no{font-weight:700;font-size:16px}
.tbl .st{font-size:12px;color:var(--muted)}
.tbl .amt{margin-top:auto;font-size:17px;font-weight:600}
.tbl.busy{background:var(--basil-soft);border-color:var(--basil)}
.tbl.busy .st{color:var(--basil)}
.tbl.long .st{color:var(--amber)}
.tbl.sel{outline:3px solid var(--basil);outline-offset:1px}

.order{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 100px)}
.order[hidden]{display:none!important}
.ohead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ohead h2{margin:0;font-size:18px}
.ohead .st{color:var(--muted);font-size:12px}
.ohead .x{margin-left:auto}
.cats{display:flex;gap:6px;padding:10px 14px 0;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;padding:10px 14px;overflow:auto;max-height:38vh}
.mi{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:62px}
.mi .n{font-weight:600;font-size:14px;line-height:1.25}
.mi .p{font-size:12.5px;color:var(--muted)}
.mi:active{background:var(--basil-soft)}
.mi[disabled]{opacity:.45;cursor:not-allowed}
.mi[disabled] .p::after{content:" · 품절";color:var(--tomato)}
.lines{border-top:1px solid var(--line);overflow:auto;flex:1;min-height:90px}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px dashed var(--line)}
.line .nm{font-weight:500;min-width:0;overflow-wrap:anywhere}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.qty span{min-width:22px;text-align:center}
.empty{padding:22px 14px;color:var(--muted);font-size:14px;text-align:center}
.ofoot{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.total{display:flex;justify-content:space-between;align-items:baseline}
.total b{font-size:24px}
.memo{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;font-weight:600}
.btn.pri{background:var(--basil);color:var(--basil-ink);border-color:var(--basil);flex:1;min-height:48px;font-size:16px}
.btn.dng{color:var(--tomato)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.sm{padding:6px 10px;font-size:13px}

/* 매출 */
.salesbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.salesbar input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .l{font-size:12px;color:var(--muted);letter-spacing:.02em}
.kpi .v{font-size:22px;font-weight:600;margin-top:2px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel h3{margin:0;padding:12px 14px;font-size:14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.panel h3 span{font-weight:500;color:var(--muted);font-size:12px}
.scroll{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:8px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:8px 14px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.r,table.t th.r{text-align:right}
tr.void td{color:var(--muted);text-decoration:line-through}
tr.void td:last-child{text-decoration:none}
.bar{height:6px;background:var(--sunk);border-radius:3px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--basil)}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.tag.card{background:var(--basil-soft);color:var(--basil)}
.tag.cash{background:var(--amber-soft);color:var(--amber)}
.tag.pre{background:var(--tomato-soft);color:var(--tomato)}

/* 메뉴 관리 */
.mgr{display:grid;gap:16px;max-width:880px}
.mrow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,.9fr) auto auto;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line)}
.mrow input,.mrow select,.setrow input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
.mrow.head{font-size:12px;color:var(--muted);font-weight:600}
.sold{display:flex;align-items:center;gap:4px;font-size:13px;white-space:nowrap}
.setrow{display:flex;gap:12px;align-items:center;padding:12px 14px;flex-wrap:wrap}
.setrow label{font-size:13px;color:var(--muted);min-width:90px}
.setrow input{max-width:220px}

/* 모달·토스트 */
.scrim{position:fixed;inset:0;background:rgba(10,14,9,.45);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--surface);border-radius:12px;max-width:420px;width:100%;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.dlg h4{margin:0;font-size:17px}
.dlg p{margin:0;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:40;font-weight:600;font-size:14px}

@media (max-width:820px){
  .floor{grid-template-columns:minmax(0,1fr)}
  .order{position:fixed;inset:0;z-index:20;max-height:none;border-radius:0;border:0;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
    padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .menu{max-height:40vh}
  .cols{grid-template-columns:minmax(0,1fr)}
  .mrow{grid-template-columns:minmax(0,1fr) minmax(0,90px) auto;}
  .mrow .c-cat{grid-column:1/2}
  .mrow.head{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span id="shopName">Bistro CIBO</span><small>주문판</small></div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-v="floor" aria-selected="true">테이블</button>
      <button role="tab" data-v="sales" aria-selected="false">매출</button>
      <button role="tab" data-v="menu" aria-selected="false">메뉴</button>
    </nav>
    <div class="mode" id="mode">불러오는 중…</div>
  </header>

  <main>
    <section class="view" id="v-floor">
      <div class="floor noorder" id="floor">
        <div>
          <div class="sumbar">
            <span>사용 중 <b class="num" id="sBusy">0</b>/<span class="num" id="sAll">0</span> 테이블</span>
            <span>진행 중 주문 <b class="num" id="sOpen">0</b>원</span>
            <span>오늘 마감 <b class="num" id="sToday">0</b>원</span>
          </div>
          <div class="tables" id="tables"></div>
        </div>
        <aside class="order" id="order" hidden>
          <div class="ohead">
            <h2 id="oTitle">테이블</h2><span class="st" id="oSince"></span>
            <button class="btn sm x" id="oClose">닫기</button>
          </div>
          <div class="cats" id="cats"></div>
          <div class="menu" id="menuGrid"></div>
          <div class="lines" id="lines"></div>
          <div class="ofoot">
            <div class="total"><span>합계</span><b class="num" id="oTotal">0원</b></div>
            <input class="memo" id="oMemo" placeholder="메모 (예: 맵게, 2인 나눠서)">
            <div class="row">
              <button class="btn sm" id="oMove">테이블 이동</button>
              <button class="btn sm dng" id="oClear">주문 비우기</button>
            </div>
            <button class="btn pri" id="oDone">계산 완료 · 매출 기록</button>
          </div>
        </aside>
      </div>
    </section>

    <section class="view" id="v-sales" hidden>
      <div class="salesbar">
        <label for="sDate">날짜</label><input type="date" id="sDate">
        <button class="btn sm" id="sPrev">전날</button><button class="btn sm" id="sNext">다음날</button><button class="btn sm" id="sTodayBtn">오늘</button>
      </div>
      <div class="kpis" id="kpis"></div>
      <div class="cols">
        <div class="panel"><h3>메뉴별 판매 <span id="rankSub"></span></h3><div class="scroll"><table class="t" id="rank"></table></div></div>
        <div class="panel"><h3>계산 내역 <span>취소한 건은 합계에서 빠짐</span></h3><div class="scroll"><table class="t" id="receipts"></table></div></div>
      </div>
    </section>

    <section class="view" id="v-menu" hidden>
      <div class="mgr">
        <div class="panel">
          <h3>가게 설정</h3>
          <div class="setrow"><label for="cfgName">가게 이름</label><input id="cfgName"></div>
          <div class="setrow"><label for="cfgTables">테이블 수</label><input id="cfgTables" type="number" min="1" max="60"><button class="btn sm" id="cfgSave">저장</button></div>
        </div>
        <div class="panel">
          <h3>백업 <span id="bkInfo">아직 백업한 적 없음</span></h3>
          <div class="setrow" style="color:var(--muted);font-size:13px">주문과 매출은 이 기기의 브라우저에만 저장됩니다. 브라우저 기록을 지우거나 기기를 바꾸면 사라지니, 마감 후 백업 파일을 저장해 두세요. 다른 기기로 옮길 때도 이 파일을 불러오면 됩니다.</div>
          <div class="setrow">
            <button class="btn sm" id="bkSave">백업 파일 저장</button>
            <label class="btn sm" for="bkFile" style="min-width:0">백업 불러오기</label>
            <input type="file" id="bkFile" accept=".json,application/json" hidden>
          </div>
        </div>
        <div class="panel">
          <h3>메뉴 <span id="menuCount"></span></h3>
          <div class="mrow head"><span>이름</span><span>가격(원)</span><span class="c-cat">분류</span><span>품절</span><span></span></div>
          <div id="menuRows"></div>
          <div class="setrow"><button class="btn sm" id="addMenu">+ 메뉴 추가</button></div>
        </div>
      </div>
    </section>
  </main>
</div>
<div id="layer"></div>

<script>
(function(){
"use strict";
// ---------- 유틸 ----------
const $=s=>document.querySelector(s);
const won=n=>(Math.round(n)||0).toLocaleString("ko-KR");
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TAGS=[{k:"card",l:"카드"},{k:"cash",l:"현금"},{k:"pre",l:"선불장부"},{k:"etc",l:"기타"}];
const tagLabel=k=>(TAGS.find(t=>t.k===k)||{l:"미지정"}).l;
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function modal(html,bind){const l=$("#layer");l.innerHTML='<div class="scrim"><div class="dlg" role="dialog" aria-modal="true">'+html+'</div></div>';
  const close=()=>{l.innerHTML=""};l.querySelector(".scrim").addEventListener("click",e=>{if(e.target.classList.contains("scrim"))close()});bind(l,close);}
function confirmBox(title,body,okLabel,onOk){modal('<h4>'+esc(title)+'</h4><p>'+esc(body)+'</p><div class="row"><button class="btn" data-c>취소</button><button class="btn pri" data-o>'+esc(okLabel)+'</button></div>',
  (l,close)=>{l.querySelector("[data-c]").onclick=close;l.querySelector("[data-o]").onclick=()=>{close();onOk()}})}

// ---------- 상태 ----------
const S={menu:[],tables:{},config:{tableCount:10,shopName:"Bistro CIBO"},sales:[],today:[],sel:null,cat:"전체",view:"floor",salesDate:ymd(new Date()),ready:false};

// 로그인하지 않았을 때만 쓰는 이 기기 전용 저장소(예시 메뉴 포함)
const LOCAL_KEY="cibo-pos-local-v1";
const SAMPLE_MENU=[["페스카토레",16500],["봉골레",14000],["부카니에라 토마토",16000],["카치오에페페",15000],["부카니에라 크림",16000],["쵸피노",18000],["알리오",12500],["카비알레",15500],["라구",17000],["까르보나라",14000],["스트라치아텔라",15500],["고르곤졸라",15000],["아마트리치아나",14000],["포르치니",15000],["마리나라",16000],["마르게리따",18000],["감베로니",18000],["치보샐러드",15000]];

// ---------- 저장소 어댑터 ----------
const db=null; let local=null;
const queue={}; // 문서별 쓰기 순서 보장
function serial(path,fn){const prev=queue[path]||Promise.resolve();const next=prev.then(fn).catch(e=>{console.warn(e);toast("저장 실패: 연결을 확인하세요")});queue[path]=next;return next}
function loadLocal(){try{local=JSON.parse(localStorage.getItem(LOCAL_KEY)||"null")}catch(e){local=null}
  if(!local){local={menu:{},tables:{},sales:{},config:{tableCount:10,shopName:"Bistro CIBO"}};
    SAMPLE_MENU.forEach(([n,p],i)=>{local.menu["m"+(i+1)]={name:n,price:p,cat:n==="치보샐러드"?"샐러드":"파스타",order:i+1,soldOut:false}})}
}
function saveLocal(){try{localStorage.setItem(LOCAL_KEY,JSON.stringify(local))}catch(e){}}
function syncFromLocal(){S.menu=Object.entries(local.menu).map(([id,d])=>({id,...d})).sort((a,b)=>(a.order||0)-(b.order||0));
  S.tables=JSON.parse(JSON.stringify(local.tables));S.config={...local.config};
  const all=Object.entries(local.sales).map(([id,d])=>({id,...d}));
  S.sales=all.filter(x=>x.date===S.salesDate).sort((a,b)=>b.at-a.at);S.today=all.filter(x=>x.date===ymd(new Date()));render()}
const store={
  set(coll,id,data){if(db)return serial(coll+"/"+id,()=>db.collection(coll).doc(id).set(data));local[coll][id]=data;saveLocal();syncFromLocal();return Promise.resolve()},
  update(coll,id,data){if(db)return serial(coll+"/"+id,()=>db.collection(coll).doc(id).update(data));local[coll][id]={...local[coll][id],...data};saveLocal();syncFromLocal();return Promise.resolve()},
  del(coll,id){if(db)return serial(coll+"/"+id,()=>db.collection(coll).doc(id).delete());delete local[coll][id];saveLocal();syncFromLocal();return Promise.resolve()},
  add(coll,data){const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);return this.set(coll,id,data)},
  setConfig(data){if(db)return serial("config/main",()=>db.doc("config/main").set(data));local.config=data;saveLocal();syncFromLocal();return Promise.resolve()}
};

function subscribeSales(){
  syncFromLocal();
}
function boot(){
  loadLocal();S.ready=true;
  $("#mode").textContent="이 기기에 저장됩니다 · 마감 후 메뉴 탭에서 백업하세요";
  syncFromLocal();
}

// ---------- 계산 ----------
const tableTotal=t=>(t&&t.items||[]).reduce((a,i)=>a+i.price*i.qty,0);
const liveSum=list=>list.filter(x=>!x.voided).reduce((a,x)=>a+(x.total||0),0);
function sinceText(ms){const m=Math.floor((Date.now()-ms)/60000);if(m<1)return"방금";if(m<60)return m+"분째";return Math.floor(m/60)+"시간 "+(m%60)+"분째"}

// ---------- 렌더 ----------
function render(){$("#shopName").textContent=S.config.shopName||"Bistro CIBO";renderFloor();renderOrder();renderSales();renderMenuMgr()}
function renderFloor(){
  const n=Math.max(1,Math.min(60,+S.config.tableCount||10));let html="",busy=0,open=0;
  for(let i=1;i<=n;i++){const id="t"+i,t=S.tables[id],amt=tableTotal(t),has=t&&t.items&&t.items.length;
    if(has){busy++;open+=amt}
    const long=has&&t.openedAt&&Date.now()-t.openedAt>90*60000;
    html+='<button class="tbl'+(has?" busy":"")+(long?" long":"")+(S.sel===id?" sel":"")+'" data-t="'+id+'"><span class="no">'+i+'번</span><span class="st">'+(has?esc(sinceText(t.openedAt))+" · "+t.items.reduce((a,x)=>a+x.qty,0)+"개":"비어 있음")+'</span><span class="amt num">'+(has?won(amt)+"원":"")+'</span></button>'}
  // 테이블 수를 줄였는데 남은 주문이 있으면 표시
  Object.keys(S.tables).forEach(id=>{const k=+id.slice(1);if(k>n&&S.tables[id].items&&S.tables[id].items.length){busy++;open+=tableTotal(S.tables[id]);html+='<button class="tbl busy" data-t="'+id+'"><span class="no">'+k+'번</span><span class="st">테이블 수 밖</span><span class="amt num">'+won(tableTotal(S.tables[id]))+'원</span></button>'}});
  $("#tables").innerHTML=html;$("#sBusy").textContent=busy;$("#sAll").textContent=n;$("#sOpen").textContent=won(open);$("#sToday").textContent=won(liveSum(S.today));
}
function cats(){return["전체",...new Set(S.menu.map(m=>m.cat||"기타"))]}
function renderOrder(){
  const box=$("#order");if(!S.sel){box.hidden=true;$("#floor").classList.add("noorder");return}
  box.hidden=false;$("#floor").classList.remove("noorder");
  const t=S.tables[S.sel]||{items:[]};
  $("#oTitle").textContent=S.sel.slice(1)+"번 테이블";$("#oSince").textContent=t.openedAt?sinceText(t.openedAt):"새 주문";
  const cs=cats();if(!cs.includes(S.cat))S.cat="전체";
  $("#cats").innerHTML=cs.map(c=>'<button class="chip" data-cat="'+esc(c)+'" aria-pressed="'+(c===S.cat)+'">'+esc(c)+'</button>').join("");
  const list=S.menu.filter(m=>S.cat==="전체"||(m.cat||"기타")===S.cat);
  $("#menuGrid").innerHTML=list.length?list.map(m=>'<button class="mi" data-m="'+esc(m.id)+'"'+(m.soldOut?" disabled":"")+'><span class="n">'+esc(m.name)+'</span><span class="p num">'+won(m.price)+'</span></button>').join(""):'<div class="empty">메뉴가 없습니다. 메뉴 탭에서 추가하세요.</div>';
  const items=t.items||[];
  $("#lines").innerHTML=items.length?items.map((it,i)=>'<div class="line"><span class="nm">'+esc(it.name)+'<br><small class="num" style="color:var(--muted)">'+won(it.price)+'원</small></span><span class="qty"><button data-dec="'+i+'" aria-label="빼기">−</button><span class="num">'+it.qty+'</span><button data-inc="'+i+'" aria-label="더하기">+</button></span><span class="num">'+won(it.price*it.qty)+'</span></div>').join(""):'<div class="empty">위 메뉴를 누르면 주문에 담깁니다.</div>';
  $("#oTotal").textContent=won(tableTotal(t))+"원";
  if(document.activeElement!==$("#oMemo"))$("#oMemo").value=t.memo||"";
  $("#oDone").disabled=!items.length;$("#oClear").disabled=!items.length;$("#oMove").disabled=!items.length;
}
function renderSales(){
  $("#sDate").value=S.salesDate;
  const live=S.sales.filter(x=>!x.voided),total=liveSum(S.sales),cnt=live.length;
  const by={};TAGS.forEach(t=>by[t.k]=0);live.forEach(x=>{by[x.tag||"etc"]=(by[x.tag||"etc"]||0)+x.total});
  $("#kpis").innerHTML='<div class="kpi"><div class="l">매출 합계</div><div class="v num">'+won(total)+'원</div></div><div class="kpi"><div class="l">계산 건수</div><div class="v num">'+cnt+'건</div></div><div class="kpi"><div class="l">평균 객단가</div><div class="v num">'+won(cnt?total/cnt:0)+'원</div></div>'+
    TAGS.map(t=>'<div class="kpi"><div class="l">'+t.l+'</div><div class="v num">'+won(by[t.k])+'원</div></div>').join("");
  const agg={};live.forEach(x=>(x.items||[]).forEach(i=>{const a=agg[i.name]||(agg[i.name]={q:0,s:0});a.q+=i.qty;a.s+=i.qty*i.price}));
  const rows=Object.entries(agg).sort((a,b)=>b[1].s-a[1].s),max=rows.length?rows[0][1].s:1;
  $("#rankSub").textContent=rows.length?rows.length+"개 메뉴":"";
  $("#rank").innerHTML=rows.length?'<tr><th>메뉴</th><th class="r">수량</th><th class="r">금액(원)</th></tr>'+rows.map(([n,a])=>'<tr><td>'+esc(n)+'<div class="bar"><i style="width:'+(a.s/max*100).toFixed(1)+'%"></i></div></td><td class="r num">'+a.q+'</td><td class="r num">'+won(a.s)+'</td></tr>').join(""):'<tr><td class="empty">이 날짜에 기록된 매출이 없습니다.</td></tr>';
  $("#receipts").innerHTML=S.sales.length?'<tr><th>시각</th><th>테이블</th><th>내용</th><th>구분</th><th class="r">금액(원)</th><th></th></tr>'+S.sales.map(x=>{const d=new Date(x.at);
    return '<tr class="'+(x.voided?"void":"")+'"><td class="num">'+pad(d.getHours())+":"+pad(d.getMinutes())+'</td><td>'+esc(x.table)+'번</td><td>'+esc((x.items||[]).map(i=>i.name+(i.qty>1?" ×"+i.qty:"")).join(", "))+(x.memo?'<br><small style="color:var(--muted)">'+esc(x.memo)+'</small>':"")+'</td><td><span class="tag '+esc(x.tag||"")+'">'+esc(tagLabel(x.tag))+'</span></td><td class="r num">'+won(x.total)+'</td><td><button class="btn sm'+(x.voided?"":" dng")+'" data-void="'+esc(x.id)+'">'+(x.voided?"복구":"취소")+'</button></td></tr>'}).join(""):'<tr><td class="empty">이 날짜에 계산 내역이 없습니다.</td></tr>';
}
function renderMenuMgr(){
  const ae=document.activeElement;if(ae&&/^(INPUT|SELECT)$/.test(ae.tagName)&&ae.closest("#v-menu")&&ae.type!=="checkbox")return; // 입력 중엔 다시 그리지 않음
  $("#cfgName").value=S.config.shopName||"";$("#cfgTables").value=S.config.tableCount||10;
  $("#menuCount").textContent=S.menu.length+"개";
  const cs=[...new Set(["파스타","샐러드","피자","음료","주류","디저트",...S.menu.map(m=>m.cat||"기타")])];
  $("#menuRows").innerHTML=S.menu.map(m=>'<div class="mrow" data-id="'+esc(m.id)+'"><input id="mn-'+esc(m.id)+'" data-f="name" value="'+esc(m.name)+'" aria-label="메뉴 이름"><input id="mp-'+esc(m.id)+'" data-f="price" type="number" inputmode="numeric" step="500" value="'+(m.price||0)+'" aria-label="가격"><select id="mc-'+esc(m.id)+'" class="c-cat" data-f="cat" aria-label="분류">'+cs.map(c=>'<option'+(c===(m.cat||"기타")?" selected":"")+'>'+esc(c)+'</option>').join("")+'</select><label class="sold"><input type="checkbox" data-f="soldOut"'+(m.soldOut?" checked":"")+'> 품절</label><button class="btn sm dng" data-delm="'+esc(m.id)+'">삭제</button></div>').join("")||'<div class="empty">메뉴가 없습니다. 아래에서 추가하세요.</div>';
}

// ---------- 주문 동작 ----------
function curTable(){return JSON.parse(JSON.stringify(S.tables[S.sel]||{items:[],memo:""}))}
function writeTable(id,t){if(!t.items.length&&!t.memo){return store.del("tables",id)}if(!t.openedAt)t.openedAt=Date.now();S.tables[id]=t;renderOrder();renderFloor();return store.set("tables",id,t)}
function addItem(mid){const m=S.menu.find(x=>x.id===mid);if(!m||m.soldOut)return;const t=curTable();const ex=t.items.find(i=>i.mid===mid&&i.price===m.price);if(ex)ex.qty++;else t.items.push({mid,name:m.name,price:+m.price||0,qty:1});writeTable(S.sel,t)}
function changeQty(i,d){const t=curTable();const it=t.items[i];if(!it)return;it.qty+=d;if(it.qty<=0)t.items.splice(i,1);if(!t.items.length){t.memo="";delete S.tables[S.sel];renderOrder();renderFloor();store.del("tables",S.sel);return}writeTable(S.sel,t)}
function settle(){const t=curTable();if(!t.items.length)return;const total=tableTotal(t);
  modal('<h4>'+S.sel.slice(1)+'번 테이블 계산 완료</h4><p>합계 <b class="num" style="color:var(--fg)">'+won(total)+'원</b>을 오늘 매출로 기록합니다. 결제는 카드 단말기에서 따로 하고, 여기서는 어떻게 받았는지만 고르세요.</p><div class="grid2">'+TAGS.map(x=>'<button class="btn" data-tag="'+x.k+'">'+x.l+'</button>').join("")+'</div><button class="btn" data-c>취소</button>',
  (l,close)=>{l.querySelector("[data-c]").onclick=close;l.querySelectorAll("[data-tag]").forEach(b=>b.onclick=()=>{close();const now=new Date();const id=S.sel;
    store.add("sales",{table:+id.slice(1),items:t.items,total,memo:t.memo||"",tag:b.dataset.tag,at:now.getTime(),date:ymd(now),month:ymd(now).slice(0,7),voided:false});
    delete S.tables[id];store.del("tables",id);S.sel=null;render();toast(won(total)+"원 기록 완료")})});
}
function moveTable(){const n=Math.max(1,+S.config.tableCount||10);let opts="";for(let i=1;i<=n;i++){const id="t"+i;if(id===S.sel)continue;const busy=S.tables[id]&&S.tables[id].items&&S.tables[id].items.length;opts+='<button class="btn" data-to="'+id+'"'+(busy?" disabled":"")+'>'+i+'번</button>'}
  modal('<h4>'+S.sel.slice(1)+'번 → 어느 테이블로?</h4><p>사용 중인 테이블은 고를 수 없습니다.</p><div class="grid2">'+opts+'</div><button class="btn" data-c>취소</button>',
  (l,close)=>{l.querySelector("[data-c]").onclick=close;l.querySelectorAll("[data-to]").forEach(b=>b.onclick=()=>{close();const from=S.sel,to=b.dataset.to,t=curTable();store.set("tables",to,t).then(()=>store.del("tables",from));S.tables[to]=t;delete S.tables[from];S.sel=to;render();toast(to.slice(1)+"번으로 옮겼습니다")})})}

// ---------- 이벤트 ----------
document.querySelector("nav.tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-v]");if(!b)return;S.view=b.dataset.v;
  document.querySelectorAll("nav.tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));["floor","sales","menu"].forEach(v=>$("#v-"+v).hidden=v!==S.view);render()});
$("#tables").addEventListener("click",e=>{const b=e.target.closest("[data-t]");if(!b)return;S.sel=S.sel===b.dataset.t&&innerWidth>820?null:b.dataset.t;renderFloor();renderOrder()});
$("#oClose").onclick=()=>{S.sel=null;renderFloor();renderOrder()};
$("#cats").addEventListener("click",e=>{const b=e.target.closest("[data-cat]");if(!b)return;S.cat=b.dataset.cat;renderOrder()});
$("#menuGrid").addEventListener("click",e=>{const b=e.target.closest("[data-m]");if(b)addItem(b.dataset.m)});
$("#lines").addEventListener("click",e=>{const d=e.target.closest("[data-dec]"),i=e.target.closest("[data-inc]");if(d)changeQty(+d.dataset.dec,-1);if(i)changeQty(+i.dataset.inc,1)});
$("#oMemo").addEventListener("change",e=>{const t=curTable();t.memo=e.target.value.trim();if(t.items.length)writeTable(S.sel,t)});
$("#oDone").onclick=settle;$("#oMove").onclick=moveTable;
$("#oClear").onclick=()=>confirmBox(S.sel.slice(1)+"번 주문 비우기","담긴 메뉴를 모두 지웁니다. 매출로 기록되지 않습니다.","비우기",()=>{const id=S.sel;delete S.tables[id];store.del("tables",id);render()});

function shiftDay(n){const d=new Date(S.salesDate+"T12:00:00");d.setDate(d.getDate()+n);S.salesDate=ymd(d);subscribeSales();renderSales()}
$("#sDate").addEventListener("change",e=>{if(e.target.value){S.salesDate=e.target.value;subscribeSales();renderSales()}});
$("#sPrev").onclick=()=>shiftDay(-1);$("#sNext").onclick=()=>shiftDay(1);$("#sTodayBtn").onclick=()=>{S.salesDate=ymd(new Date());subscribeSales();renderSales()};
$("#receipts").addEventListener("click",e=>{const b=e.target.closest("[data-void]");if(!b)return;const x=S.sales.find(s=>s.id===b.dataset.void);if(!x)return;
  if(x.voided){store.update("sales",x.id,{voided:false});toast("복구했습니다")}
  else confirmBox("계산 취소",won(x.total)+"원 건을 매출에서 뺍니다. 기록은 남고 언제든 복구할 수 있습니다.","매출에서 빼기",()=>{store.update("sales",x.id,{voided:true});toast("매출에서 뺐습니다")})});

$("#menuRows").addEventListener("change",e=>{const row=e.target.closest(".mrow");if(!row)return;const f=e.target.dataset.f;let v=e.target.type==="checkbox"?e.target.checked:e.target.value;
  if(f==="price")v=Math.max(0,Math.round(+v||0));if(f==="name"){v=v.trim();if(!v){toast("이름을 입력하세요");return}}store.update("menu",row.dataset.id,{[f]:v})});
$("#menuRows").addEventListener("click",e=>{const b=e.target.closest("[data-delm]");if(!b)return;const m=S.menu.find(x=>x.id===b.dataset.delm);
  confirmBox("메뉴 삭제",(m?m.name:"이 메뉴")+"를 메뉴판에서 지웁니다. 지난 매출 기록은 그대로 남습니다.","삭제",()=>store.del("menu",b.dataset.delm))});
$("#addMenu").onclick=()=>{const order=(S.menu.reduce((a,m)=>Math.max(a,m.order||0),0))+1;store.add("menu",{name:"새 메뉴",price:10000,cat:"파스타",order,soldOut:false});toast("맨 아래에 추가했습니다")};
$("#cfgSave").onclick=()=>{const n=Math.max(1,Math.min(60,Math.round(+$("#cfgTables").value||10)));const name=$("#cfgName").value.trim()||"Bistro CIBO";store.setConfig({tableCount:n,shopName:name});document.activeElement.blur();toast("저장했습니다")};

function bkInfo(){try{const t=localStorage.getItem(LOCAL_KEY+"-bk");$("#bkInfo").textContent=t?"마지막 백업 "+t:"아직 백업한 적 없음"}catch(e){}}
$("#bkSave").onclick=()=>{const now=new Date();const name="CIBO주문판_백업_"+ymd(now)+"_"+pad(now.getHours())+pad(now.getMinutes())+".json";
  const blob=new Blob([JSON.stringify({app:"cibo-pos",version:1,savedAt:now.toISOString(),data:local},null,1)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  try{localStorage.setItem(LOCAL_KEY+"-bk",ymd(now)+" "+pad(now.getHours())+":"+pad(now.getMinutes()))}catch(e){}bkInfo();toast("백업 파일을 저장했습니다")};
$("#bkFile").addEventListener("change",e=>{const f=e.target.files[0];e.target.value="";if(!f)return;const r=new FileReader();
  r.onload=()=>{let j;try{j=JSON.parse(r.result)}catch(err){toast("백업 파일을 읽을 수 없습니다");return}
    const d=j&&j.data;if(!d||!d.menu||!d.sales||!d.config){toast("주문판 백업 파일이 아닙니다");return}
    confirmBox("백업 불러오기",(j.savedAt?j.savedAt.slice(0,10)+" 백업으로 ":"")+"지금 이 기기의 메뉴·주문·매출을 모두 바꿉니다. 되돌릴 수 없습니다.","불러오기",()=>{local={menu:d.menu,tables:d.tables||{},sales:d.sales,config:d.config};saveLocal();S.sel=null;syncFromLocal();toast("불러왔습니다")})};
  r.readAsText(f)});
bkInfo();
setInterval(()=>{if(S.view==="floor"){renderFloor();if(S.sel)$("#oSince").textContent=S.tables[S.sel]&&S.tables[S.sel].openedAt?sinceText(S.tables[S.sel].openedAt):"새 주문"}},30000);
boot();
})();
</script>
</body>
</html>
